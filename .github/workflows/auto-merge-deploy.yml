name: Auto merge & deploy

# 개발 브랜치에 푸시되면 배포 브랜치로 자동 머지한다.
# 배포 브랜치 푸시는 Vercel(외부 GitHub App)의 자동 배포를 트리거한다.
on:
  push:
    branches:
      - claude/massagego-domain-change-zb9cf8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-merge-deploy
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge feature into deploy branch (→ Vercel auto-deploy)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/intelligent-mccarthy-bt42U:claude/intelligent-mccarthy-bt42U
          git checkout claude/intelligent-mccarthy-bt42U
          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "이미 배포 브랜치에 포함됨 — 머지 건너뜀"
          else
            git merge --no-ff "$GITHUB_SHA" \
              -m "Auto-merge ${GITHUB_SHA:0:7} → deploy"
            git push origin claude/intelligent-mccarthy-bt42U
            echo "배포 브랜치로 머지·푸시 완료 → Vercel 자동 배포"
          fi
