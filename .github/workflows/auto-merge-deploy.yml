name: Auto merge & deploy

# 개발 브랜치에 푸시되면 배포 브랜치로 자동 머지한다.
#  - Vercel: 배포 브랜치 푸시 이벤트로 자동 배포(외부 GitHub App)
#  - GitHub Pages: 시크릿 DEPLOY_PAT가 설정돼 있으면 PAT로 푸시 → deploy.yml 재트리거
#                  (GITHUB_TOKEN 푸시는 다른 워크플로를 재트리거하지 못하므로 PAT 필요)
#                  DEPLOY_PAT가 없으면 GITHUB_TOKEN으로 폴백(=Vercel만 배포).
on:
  push:
    branches:
      - claude/massagego-domain-change-zb9cf8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-merge-deploy
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT가 있으면 그 토큰으로 푸시 → deploy.yml(Pages) 재트리거. 없으면 기본 토큰.
          token: ${{ secrets.DEPLOY_PAT || github.token }}

      - name: Merge feature into deploy branch (→ Vercel + Pages auto-deploy)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/intelligent-mccarthy-bt42U:claude/intelligent-mccarthy-bt42U
          git checkout claude/intelligent-mccarthy-bt42U
          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "이미 배포 브랜치에 포함됨 — 머지 건너뜀"
          else
            git merge --no-ff "$GITHUB_SHA" \
              -m "Auto-merge ${GITHUB_SHA:0:7} → deploy"
            git push origin claude/intelligent-mccarthy-bt42U
            echo "배포 브랜치로 머지·푸시 완료 → Vercel 자동 배포"
          fi
